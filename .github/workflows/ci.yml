# Runs the deterministic checks on every push/PR so the invariants in CLAUDE.md
# that ARE machine-checked (strict typecheck + the test suite) can't silently rot.
# (Activates once this repo has a GitHub remote.)
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # typecheck (strict TS) + vitest + the dependency cruise + the generated graph.
      # `docs/architecture-graph.md` is generated and committed, so it is only worth having if
      # it is TRUE — `graph:check` regenerates it in memory and fails if the committed copy has
      # drifted. It lives inside `npm run check` rather than as a step here on purpose: run
      # from CI alone, this gate could only ever fire AFTER a push, on a file the developer had
      # no reason to know was generated.
      - run: npm run check
      - run: npm run build   # the bundle must build
