# Publishes a verifiable release when a v* tag is pushed. Each release carries a
# signed SLSA build-provenance attestation and a SHA256SUMS file, so anyone can prove
# the published artifact was built by THIS workflow from THIS commit — turning "trust
# me, it's safe" into a check. See README → "Verifying a release". Also pushes the
# same build live to the Chrome Web Store, so a tagged release is the only manual
# step left — everything downstream of it, GitHub AND the store, is automatic.
#
# Normally reached via auto-tag.yml, which creates and pushes the v* tag itself once
# a version bump lands on main, then calls this workflow directly (workflow_call) —
# a tag pushed by the default GITHUB_TOKEN doesn't cascade-trigger the `push: tags`
# event below, so the chain has to be explicit. The tag trigger still works standalone
# as a manual escape hatch: git tag v0.2.0 && git push origin v0.2.0.
#
# No approval gate on purpose: the version-bump PR merge (see CLAUDE.md → "Cutting a
# release") is already the one conscious human checkpoint — release-visual-check runs
# BEFORE that merge, so a second click here would just be a redundant pause, not an
# extra check.
name: Release

# The run's own title, and the ONLY thing that ties a dispatched run to the tag it released.
# A dispatch runs against the default branch with the tag as an input, so its head commit is
# main's and says nothing about which release it was for — `release-status --check-publish`
# reads this title to tell a successful recovery from a still-broken release.
run-name: Release ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        description: The v* tag to release (defaults to the triggering ref's tag name)
        required: false
        type: string
  # The recovery button, and the only one that can exist. When the store upload fails on its
  # own — expired Chrome OAuth keys, or Google still reviewing the previous version — the tag
  # and the GitHub release are already there, and neither other trigger can re-reach the store
  # step: re-running the failed run replays the workflow file as it was at that commit, and
  # `push: tags` would too, so a fix that landed on main afterwards is not in either. A
  # dispatch runs the definition on the DEFAULT BRANCH, which is the only way a repaired
  # workflow ever gets applied to a tag that was cut before the repair.
  workflow_dispatch:
    inputs:
      tag:
        description: The v* tag to (re-)release, e.g. v0.22.0
        required: true
        type: string

permissions:
  contents: write # create the GitHub Release
  id-token: write # OIDC token so Sigstore can sign the attestation (no keys to manage)
  attestations: write # record the provenance attestation against the repo

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }} # explicit: workflow_call's default ref is the CALLER's (main), not this tag
          # The release body is derived from the commits since the PREVIOUS tag, so this job
          # needs the whole history and every tag — a shallow checkout of one tag can see
          # neither, and would compose notes for a range it cannot walk.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check # strict typecheck + tests gate the release
      - run: npm run package # build + zip → hi-chu-<version>.zip

      # The zip is the store upload; content.js is the deterministic bundle a verifier
      # can reproduce from source (esbuild is pinned via package-lock.json).
      - name: Hash the artifacts
        run: sha256sum hi-chu-*.zip dist/content.js | tee SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            hi-chu-*.zip
            dist/content.js

      # The human-readable half of the release body, derived from the commits in this tag's
      # range and the screenshot each of their PRs already uploaded (scripts/release-notes.mjs).
      # Composing it here is what stops it being forgotten: the body used to carry provenance
      # boilerplate alone unless somebody remembered to run `gh release edit` afterwards, and
      # "somebody remembers" is the exact failure the rest of this pipeline was built to end.
      # `--ref` is the tag, so the range starts at the tag before it rather than at the tag
      # being released, which would be empty.
      #
      # It must not be able to sink a release. Notes are cosmetic next to a published zip, so a
      # failure here downgrades to boilerplate and annotates the run instead of aborting it —
      # loud enough to notice, never load-bearing.
      - name: Compose the release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! node scripts/release-notes.mjs --ref="$RELEASE_TAG" > RELEASE_BODY.md; then
            echo "::warning::release-notes failed — publishing provenance boilerplate only"
            : > RELEASE_BODY.md
          fi
          {
            echo
            echo "---"
            echo
            echo "Signed build provenance is attached. Verify the download with \`gh attestation verify hi-chu-*.zip --repo $GITHUB_REPOSITORY\`, then see the README's \"Verifying a release\" section for the full check."
          } >> RELEASE_BODY.md

      # Idempotent, because RE-RUNNING THIS JOB IS THE DOCUMENTED RECOVERY. The store upload
      # below is the step that fails on its own — expired Chrome OAuth keys, or Google
      # refusing to publish while the previous version is still in review — and by then the
      # GitHub release exists, so a plain `gh release create` would abort on "already exists"
      # before execution ever reached the step that actually needed retrying. The recovery
      # was documented but untested; v0.22.0 is the release that found that out.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # Assets only. The BODY is deliberately left alone on a re-run: by then it may
            # carry a summary a human refined, and this job would overwrite it with freshly
            # composed notes that are frequently worse — `release-notes.mjs` runs from the
            # TAG's tree, so any improvement to it made after the tag was cut simply isn't
            # there, and for a tag predating that script it composes nothing at all. A
            # recovery re-run exists to reach a failed later step, not to re-author the body;
            # v0.22.0 had its notes silently replaced with boilerplate by exactly this.
            echo "::notice::$RELEASE_TAG already published — refreshing assets, leaving the body as-is"
            gh release upload "$RELEASE_TAG" hi-chu-*.zip SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" hi-chu-*.zip SHA256SUMS \
              --title "$RELEASE_TAG" \
              --notes-file RELEASE_BODY.md
          fi

      # Uploads + publishes the same zip live on the store. Needs CHROME_CLIENT_ID /
      # CHROME_CLIENT_SECRET / CHROME_REFRESH_TOKEN / CHROME_PUBLISHER_ID as repo
      # secrets (see CLAUDE.md → "Cutting a release" for the one-time setup — the
      # refresh token requires an interactive Google OAuth consent only the account
      # owner can do). EXTENSION_ID is public (it's in the store URL), not a secret.
      - name: Publish to the Chrome Web Store
        env:
          EXTENSION_ID: kjdnmonplcbfldefppjoohlleelfcmik
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
        run: npx --yes chrome-webstore-upload-cli@4.0.1 --source hi-chu-*.zip
